<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 扩图 API 路线封面</title>
  <desc id="desc">展示从裁切图片到横幅画面的 AI 扩图工作流，包含 CrazyRouter API 路由节点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2f2a"/>
      <stop offset="0.52" stop-color="#123f59"/>
      <stop offset="1" stop-color="#231f3f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#dff3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#041816" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 660 C250 560 390 760 640 650 C900 535 1050 690 1320 560 C1440 502 1530 510 1600 535 L1600 900 L0 900 Z" fill="#0d9373" opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="142" y="142" width="520" height="540" rx="18" fill="#152c33"/>
    <rect x="190" y="202" width="424" height="318" rx="6" fill="#d9e7ea"/>
    <path d="M190 520 L278 402 L355 462 L438 350 L614 520 Z" fill="#0d9373" opacity="0.76"/>
    <circle cx="496" cy="292" r="46" fill="#ffcf66"/>
    <rect x="190" y="560" width="424" height="52" rx="4" fill="#223f4a"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="792" y="102" width="650" height="622" rx="22" fill="url(#panel)"/>
    <rect x="850" y="172" width="534" height="310" rx="8" fill="#ffffff"/>
    <rect x="914" y="226" width="244" height="178" rx="5" fill="#e4ecef"/>
    <path d="M850 482 L984 340 L1100 430 L1210 292 L1384 482 Z" fill="#0d9373" opacity="0.82"/>
    <circle cx="1236" cy="236" r="42" fill="#ffba4a"/>
    <rect x="850" y="534" width="255" height="34" rx="17" fill="#0d9373"/>
    <rect x="850" y="590" width="440" height="20" rx="10" fill="#8aa8a4"/>
    <rect x="850" y="630" width="330" height="20" rx="10" fill="#8aa8a4"/>
  </g>
  <g fill="none" stroke="#8ee6c0" stroke-width="8" stroke-linecap="round">
    <path d="M690 392 C730 392 750 392 780 392"/>
    <path d="M752 362 L784 392 L752 422"/>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="142" y="768" fill="#f7fbf8" font-size="64" font-weight="700">AI 扩图 API 工作流</text>
    <text x="142" y="828" fill="#bfeadf" font-size="34">用 CrazyRouter 选择 gpt-image-2、Nano Banana 2 和 Nano Banana Pro</text>
    <text x="850" y="686" fill="#0a2f2a" font-size="24" font-weight="700">POST /v1/images/edits</text>
  </g>
</svg>
