<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 扩图工具决策图</title>
  <desc id="desc">按任务区分在线 uncrop、Photoshop、ChatGPT Images 和 CrazyRouter API 路线。</desc>
  <rect width="1400" height="760" fill="#f5f8f7"/>
  <text x="70" y="78" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#102b2d">先按任务选路线</text>
  <text x="70" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#53686a">比例补救、保真外扩、创意扩景和自动化 outpainting 不是同一件事。</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="70" y="190" width="280" height="390" rx="12" fill="#ffffff" stroke="#c9d9d5"/>
    <text x="104" y="244" font-size="28" font-weight="700" fill="#0d9373">比例补救</text>
    <text x="104" y="298" font-size="22" fill="#23373a">目标只是换画幅</text>
    <text x="104" y="340" font-size="22" fill="#23373a">先用在线 uncrop</text>
    <text x="104" y="398" font-size="18" fill="#65787a">适合社媒图、封面图、</text>
    <text x="104" y="426" font-size="18" fill="#65787a">背景安全边距。</text>
    <rect x="104" y="498" width="190" height="42" rx="21" fill="#e0f4ed"/>
    <text x="128" y="526" font-size="18" font-weight="700" fill="#0a6f59">手工工具</text>
    <rect x="390" y="190" width="280" height="390" rx="12" fill="#ffffff" stroke="#c9d9d5"/>
    <text x="424" y="244" font-size="28" font-weight="700" fill="#0d9373">保真外扩</text>
    <text x="424" y="298" font-size="22" fill="#23373a">主体边缘不能漂</text>
    <text x="424" y="340" font-size="22" fill="#23373a">先用 Photoshop</text>
    <text x="424" y="398" font-size="18" fill="#65787a">适合人像、商品图、</text>
    <text x="424" y="426" font-size="18" fill="#65787a">建筑线条。</text>
    <rect x="424" y="498" width="190" height="42" rx="21" fill="#e0f4ed"/>
    <text x="448" y="526" font-size="18" font-weight="700" fill="#0a6f59">编辑器</text>
    <rect x="710" y="190" width="280" height="390" rx="12" fill="#ffffff" stroke="#c9d9d5"/>
    <text x="744" y="244" font-size="28" font-weight="700" fill="#0d9373">创意扩景</text>
    <text x="744" y="298" font-size="22" fill="#23373a">靠文字推开场景</text>
    <text x="744" y="340" font-size="22" fill="#23373a">用对话式图片编辑</text>
    <text x="744" y="398" font-size="18" fill="#65787a">适合找方向、改氛围、</text>
    <text x="744" y="426" font-size="18" fill="#65787a">做多轮概念图。</text>
    <rect x="744" y="498" width="190" height="42" rx="21" fill="#e0f4ed"/>
    <text x="768" y="526" font-size="18" font-weight="700" fill="#0a6f59">低摩擦</text>
    <rect x="1030" y="190" width="280" height="390" rx="12" fill="#ffffff" stroke="#c9d9d5"/>
    <text x="1064" y="244" font-size="28" font-weight="700" fill="#0d9373">生产工作流</text>
    <text x="1064" y="298" font-size="22" fill="#23373a">批量、日志、回放</text>
    <text x="1064" y="340" font-size="22" fill="#23373a">用 CrazyRouter API</text>
    <text x="1064" y="398" font-size="18" fill="#65787a">适合电商、广告、</text>
    <text x="1064" y="426" font-size="18" fill="#65787a">应用内图片管线。</text>
    <rect x="1064" y="498" width="190" height="42" rx="21" fill="#e0f4ed"/>
    <text x="1088" y="526" font-size="18" font-weight="700" fill="#0a6f59">可自动化</text>
  </g>
  <path d="M210 624 H1190" stroke="#0d9373" stroke-width="6" stroke-linecap="round"/>
  <circle cx="210" cy="624" r="12" fill="#0d9373"/>
  <circle cx="530" cy="624" r="12" fill="#0d9373"/>
  <circle cx="850" cy="624" r="12" fill="#0d9373"/>
  <circle cx="1170" cy="624" r="12" fill="#0d9373"/>
  <text x="360" y="682" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#102b2d">从一次性修图走向可重复系统时，再上 API。</text>
</svg>
